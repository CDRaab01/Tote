services:
  db:
    image: postgres:16
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Credentials default to tote/tote for local use; override via the root .env to rotate.
    # Must stay in sync with DATABASE_URL below (same variables).
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tote}
      POSTGRES_DB: ${POSTGRES_DB:-tote}
    # Host port 5439: 5432-5438 belong to Spotter/Plate/Cookbook/dragonfly-id/Magpie/Remnant/
    # Crate on this host. Verified free 2026-08-15 against `docker ps` AND `netstat` — Docker
    # Desktop's proxy makes netstat alone unreliable, so check both before claiming a port.
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tote} -d ${POSTGRES_DB:-tote}"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - ./server/.env
    environment:
      # Reach Postgres over the compose network; overrides DATABASE_URL from .env.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tote}:${POSTGRES_PASSWORD:-tote}@db:5432/${POSTGRES_DB:-tote}
      # Deploy stamp surfaced by GET /version. deploy/redeploy.* exports these before
      # `compose up`; default to "unknown" for a plain manual `docker compose up`.
      GIT_SHA: ${GIT_SHA:-unknown}
      BUILT_AT: ${BUILT_AT:-unknown}
      # Suite SSO — public, non-secret values pinned here rather than only in .env: Compose
      # doesn't reload env_file content on `up`, so an env_file-only flag gets dropped when a
      # redeploy recreates the container without re-reading .env, silently 404ing /auth/suite.
      # Tote is SSO-only, so losing these would mean NO login path at all. (Phase 1 wires the
      # endpoint; pinning them now means the deploy that first needs them already has them.)
      SUITE_JWKS_URL: https://id.dragonflymedia.org/.well-known/jwks.json
      SUITE_ISSUER: https://id.dragonflymedia.org
      # The base written into NFC tags' URI record. A LITERAL, not an interpolation: Crate
      # shipped `${NTFY_TOPIC:-}` reading from a root .env this repo doesn't have, so the value
      # could never be anything but empty and every notification was silently off. The stakes
      # are higher here — this string gets baked into physical tags in an attic, where a wrong
      # value cannot be fixed by redeploying.
      NFC_URI_BASE: https://dragonfly.tail2ce561.ts.net:8448
      # The household's timezone, for date-only questions ("is this loan overdue"). The
      # container runs UTC and the house is US Eastern, so without this an item due today is
      # reported overdue from 7pm local. A literal, not an interpolation, for the same reason
      # as everything else in this block.
      LOCAL_TIMEZONE: America/New_York
      # LM Studio vision (item identification). Non-secret and REQUIRED, so pinned here as
      # literals rather than living in an env_file compose will not re-read.
      #
      # The config default is http://localhost:1234/v1, which is correct only for bare-metal
      # local dev: inside this container localhost IS the container, so every scan would fail
      # with a connect-refused 503 while LM Studio ran happily on the host.
      # host.docker.internal is the host from in here.
      LM_STUDIO_BASE_URL: ${LM_STUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      LM_STUDIO_VISION_MODEL: ${LM_STUDIO_VISION_MODEL:-google/gemma-4-e4b}
      # Where item photos live inside the container; the volume below maps it out.
      PHOTOS_DIR: /data/photos
      # Overdue-loan nudges. LITERALS, and the self-hosted ntfy only.
      #
      # `host.docker.internal` because ntfy runs on the host, not in this compose project — from
      # inside the container `localhost` is the container. And NEVER ntfy.sh: its topics are
      # effectively public URLs, and these messages name what you own and who has it, which is
      # the same reasoning that keeps this whole service tailnet-only. `services/ntfy.py` refuses
      # to send to that host rather than trusting this line.
      #
      # Not `${NTFY_TOPIC:-}` — that is exactly the shape that made Crate's notifications
      # silently empty for weeks, interpolating from a root .env the repo did not have.
      NTFY_BASE_URL: http://host.docker.internal:8095
      NTFY_TOPIC: tote-alerts
    volumes:
      # Item photos (originals + cleaned) live on a named volume, NOT in the container — they
      # must survive a redeploy, and unlike the catalog rows they cannot be re-derived from
      # anywhere. The database stores paths only.
      - photos:/data/photos
    depends_on:
      db:
        condition: service_healthy
    # Published on localhost only. Host port 8008: 8000-8007 belong to Spotter/Plate/
    # posterizarr/Cookbook/dragonfly-id/Magpie/Remnant/Crate. Tote is tailnet-only — NO
    # cloudflared service, no `tunnel` profile: it is reached via Tailscale Serve :8448 on the
    # host. A complete household inventory is a burglar's shopping list; keep it off the
    # public internet.
    ports:
      - "127.0.0.1:8008:8000"

volumes:
  pgdata:
  photos:
